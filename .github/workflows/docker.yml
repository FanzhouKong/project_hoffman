name: docker
on:
  push:
    branches: [main, gui-prototype]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/peak3d" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: peak3d:test
      - name: Smoke test (CLI demo and GUI)
        run: |
          docker run --rm peak3d:test --version
          mkdir -p smoke && chmod 777 smoke
          docker run --rm -v "$PWD/smoke:/data" peak3d:test demo --output /data/demo --cores 2
          test -f smoke/demo/peak3d_out/report.html
          docker run -d --name gui -p 127.0.0.1:8765:8765 -e PEAK3D_TOKEN=ci -v "$PWD/smoke:/data" peak3d:test
          for i in $(seq 30); do curl -sf -H "X-Peak3d-Token: ci" http://127.0.0.1:8765/api/info && break; sleep 1; done
          curl -sf -H "X-Peak3d-Token: ci" "http://127.0.0.1:8765/api/ls?path=/data/demo/demo_mzml" | grep -q '"n_mzml": 3'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 403
          docker logs gui
          docker rm -f gui
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
