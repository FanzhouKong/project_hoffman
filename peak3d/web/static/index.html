<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="peak3d-token" content="{{TOKEN}}">
<title>peak3d</title>
<link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main">
    <div class="brand"><span id="logo"></span><div><div class="brand-name">peak3d</div><div class="brand-sub">LC-MS feature detection</div></div></div>
    <nav class="nav">
      <button class="nav-item" data-page="run" type="button"><span class="ic"></span><span>New run</span></button>
      <button class="nav-item" data-page="results" type="button"><span class="ic"></span><span>Results</span></button>
    </nav>
    <div class="sidebar-foot">version {{VERSION}}</div>
  </aside>
  <div class="app-main">
    <header class="top-app-bar" id="bar">
      <div class="title"><span id="page-title">peak3d</span><span class="subtitle" id="page-sub"></span></div>
      <span id="bar-actions" class="row" style="gap:2px"></span>
    </header>
    <div class="app-body" id="scroll"><div id="page"></div></div>
  </div>
</div>
<dialog class="dialog" id="browse"></dialog>
<dialog class="dialog" id="confirm"></dialog>
{{SCRIPTS}}
</body>
</html>
